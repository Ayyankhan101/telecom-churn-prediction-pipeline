name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run preprocessing
        run: python src/preprocessing/preprocess.py
      
      - name: Train models
        run: python src/models/train.py
      
- name: Run evaluation
        run: python src/models/evaluate.py
      
      - name: Run tests
        run: |
          pip install pytest requests
          pytest tests/ -v || true
       
      - name: Run linting
        run: |
          pip install ruff
          ruff check src/ || true

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t churn-predictor:latest .
      
      - name: Test container
        run: |
          docker run -d -p 5000:5000 --name test-api churn-predictive:latest
          sleep 5
          docker logs test-api || true
          docker stop test-api || true